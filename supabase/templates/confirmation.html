<!doctype html>
<html lang="es-GT">
  <body
    style="
      margin: 0;
      background: #09090b;
      color: #fafafa;
      font-family: Arial, sans-serif;
    "
  >
    <table
      role="presentation"
      width="100%"
      cellspacing="0"
      cellpadding="0"
      style="padding: 32px 16px"
    >
      <tr>
        <td align="center">
          <table
            role="presentation"
            width="100%"
            cellspacing="0"
            cellpadding="0"
            style="
              max-width: 560px;
              border: 1px solid #27272a;
              border-radius: 16px;
              background: #18181b;
              padding: 32px;
            "
          >
            <tr>
              <td>
                <p
                  style="
                    margin: 0 0 24px;
                    color: #22c55e;
                    font-size: 20px;
                    font-weight: 700;
                  "
                >
                  Kontro
                </p>
                <h1 style="margin: 0 0 16px; font-size: 28px">
                  Confirma tu correo electrónico
                </h1>
                <p style="margin: 0 0 24px; color: #d4d4d8; line-height: 1.6">
                  Confirma esta dirección para terminar de crear tu cuenta y
                  comenzar a organizar tus finanzas.
                </p>
                <a
                  href="{{ .ConfirmationURL }}"
                  style="
                    display: inline-block;
                    border-radius: 10px;
                    background: #22c55e;
                    padding: 14px 22px;
                    color: #052e16;
                    font-weight: 700;
                    text-decoration: none;
                  "
                  >Confirmar correo</a
                >
                <p
                  style="
                    margin: 28px 0 0;
                    color: #a1a1aa;
                    font-size: 13px;
                    line-height: 1.5;
                  "
                >
                  Si no creaste una cuenta en Kontro, puedes ignorar este
                  mensaje.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
